name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile game.py content.py test_game.py
      - name: Run unit tests
        run: python -m unittest -v
